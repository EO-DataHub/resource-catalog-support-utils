AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'FastAPI application deployed to AWS Lambda with API Gateway'

Globals:
  Function:
    Timeout: 10
    Runtime: python3.11
    Environment:
      Variables:
        LOG_LEVEL: INFO
        LOG_REQUESTS: "true"
        LOG_REQUEST_BODY: "false"

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name

Resources:
  FastAPIFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-fastapi-${Environment}'
      CodeUri: ./
      Handler: lambda_handler.handler
      MemorySize: 512
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
      Events:
        ApiGateway:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
        ApiGatewayRoot:
          Type: Api
          Properties:
            Path: /
            Method: ANY

Outputs:
  FastAPIFunction:
    Description: "FastAPI Lambda Function ARN"
    Value: !GetAtt FastAPIFunction.Arn
  
  FastAPIFunctionIamRole:
    Description: "Implicit IAM Role created for FastAPI function"
    Value: !GetAtt FastAPIFunctionRole.Arn
  
  FastAPIApi:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/"
  
  FastAPIApiId:
    Description: "API Gateway ID"
    Value: !Ref ServerlessRestApi
