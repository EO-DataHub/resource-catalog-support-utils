name: Build and Deploy to Lambda

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  AWS_REGION: eu-west-1
  S3_BUCKET: qgis-layer-generator-sam-artifacts

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Lambda-Deploy

      - name: Set deployment environment
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
            echo "STACK_NAME=qgis-layer-generator-prod" >> $GITHUB_ENV
            echo "S3_BUCKET=qgis-layer-generator-sam-artifacts-prod" >> $GITHUB_ENV
            echo "SKIP_DEPLOYMENT=false" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "develop" ]]; then
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
            echo "STACK_NAME=qgis-layer-generator-dev" >> $GITHUB_ENV
            echo "S3_BUCKET=qgis-layer-generator-sam-artifacts-dev" >> $GITHUB_ENV
            echo "SKIP_DEPLOYMENT=false" >> $GITHUB_ENV
          else
            echo "SKIP_DEPLOYMENT=true" >> $GITHUB_ENV
            echo "Skipping deployment for branch: ${{ github.ref_name }}"
            echo "Only 'main' and 'develop' branches trigger deployments"
          fi
          if [[ "$SKIP_DEPLOYMENT" == "false" ]]; then
            echo "Deploying to environment: $ENVIRONMENT"
            echo "Stack name: $STACK_NAME"
            echo "S3 bucket: $S3_BUCKET"
          fi

      - name: Install SAM CLI
        if: env.SKIP_DEPLOYMENT == 'false'
        run: |
          pip install aws-sam-cli

      - name: Build SAM application
        if: env.SKIP_DEPLOYMENT == 'false'
        run: |
          sam build --use-container

      - name: Deploy SAM application
        if: env.SKIP_DEPLOYMENT == 'false'
        run: |
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset \
            --stack-name ${{ env.STACK_NAME }} \
            --parameter-overrides Environment=${{ env.ENVIRONMENT }} \
            --capabilities CAPABILITY_IAM \
            --region ${{ env.AWS_REGION }} \
            --s3-bucket ${{ env.S3_BUCKET }}

      - name: Get API Gateway URL
        if: env.SKIP_DEPLOYMENT == 'false'
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs[?OutputKey==`FastAPIApi`].OutputValue' \
            --output text)
          echo "Deployment successful!"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Stack: ${{ env.STACK_NAME }}"
          echo "API Gateway URL: $API_URL"
          echo "API_URL=$API_URL" >> $GITHUB_ENV
