[project]
name = "jupyter-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118.0",
    "mangum>=0.19.0",
    "pydantic>=2.11.10",
    "pydantic-settings>=2.11.0",
    "requests>=2.32.5",
    "uvicorn>=0.37.0",
    "nbformat>=5.10.0",
    "boto3>=1.34.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
]
